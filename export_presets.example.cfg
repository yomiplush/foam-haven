# Copy this file to export_presets.cfg for local builds, then fill in your own
# keystore path / user / password (see .gitignore). Do not commit secrets.
[preset.0]
name="Quest 3"
platform="Android"
runnable=true
advanced_options=true
export_filter="all_resources"
include_filter="avatars/Godette.vrm,avatars/LICENSE.txt,assets/*LICENSES.md"
exclude_filter="tools/*,tests/*,dist/*,.build-tools/*"
export_path="dist/FoamHaven-Quest3.apk"

[preset.0.options]
custom_template/debug="res://.build-tools/templates/android_debug.apk"
custom_template/release="res://.build-tools/templates/android_release.apk"
gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk="29"
gradle_build/target_sdk="34"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=12
version/name="0.8.1"
package/unique_name="jp.yomiplush.foamhaven"
package/name="Foam Haven"
package/signed=true
package/app_category=2
package/show_in_app_library=true
keystore/release="res://.build-tools/foamhaven.keystore"
keystore/release_user=""
keystore/release_password=""
xr_features/xr_mode=1
xr_features/enable_meta_plugin=true
meta_xr_features/quest_3_support=true
screen/immersive_mode=true
permissions/internet=false
permissions/record_audio=false
permissions/read_external_storage=false
permissions/write_external_storage=false
user_data_backup/allow=false
